[pytest]
testpaths = tests
# Los módulos se importan como paquete (from services.pipeline import ...,
# from routers import eventos). Sin esto, pytest corre desde tests/ y no
# encuentra ni la raíz del backend ni sql/services/routers.
pythonpath = .
asyncio_mode = auto
# Todos los fixtures async corren en el loop de la sesión, el mismo que los
# tests (ver tests/conftest.py: un solo pool de Postgres para toda la corrida).
asyncio_default_fixture_loop_scope = session
